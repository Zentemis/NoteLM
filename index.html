<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteLM — Multi-Speaker Text-to-Speech</title>
    <meta name="description" content="Free browser-based multi-speaker text-to-speech powered by Kokoro. Create conversations with different voices, all running locally.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Ambient background blobs -->
    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎙️</span>
                <h1>NoteLM</h1>
            </div>
            <p class="tagline">Multi-Speaker TTS — powered by Kokoro, running in your browser</p>
        </header>

        <!-- Speakers Strip -->
        <section class="glass-panel speakers-section">
            <div class="speakers-header">
                <span class="section-label">Speakers</span>
                <button class="btn-chip btn-add-speaker" id="addSpeakerBtn" title="Add speaker">
                    <span class="chip-plus">+</span>
                </button>
            </div>
            <div class="speakers-strip" id="speakersList"></div>
        </section>

        <!-- Script Panel -->
        <section class="glass-panel script-section">
            <div class="script-header">
                <span class="section-label">Script</span>
                <div class="script-actions">
                    <button class="btn-glass" id="pasteScriptBtn">📋 Paste</button>
                    <button class="btn-glass" id="loadExampleBtn">Example</button>
                    <button class="btn-glass btn-danger" id="clearScriptBtn">Clear</button>
                </div>
            </div>
            <div class="script-lines" id="scriptLines"></div>
            <button class="btn-add-line" id="addLineBtn">+ Add line</button>
        </section>

        <!-- Spacer for sticky bar -->
        <div class="controls-spacer"></div>
    </div>

    <!-- Sticky Controls Bar -->
    <div class="controls-bar" id="controlsBar">
        <div class="controls-inner">
            <div class="controls-buttons">
                <button class="btn-primary" id="generateBtn">
                    <span class="btn-icon">▶</span> Generate & Play
                </button>
                <button class="btn-glass" id="downloadBtn" disabled>
                    <span class="btn-icon">⬇</span> WAV
                </button>
                <button class="btn-glass" id="stopBtn" disabled>
                    <span class="btn-icon">⏹</span> Stop
                </button>
            </div>

            <!-- Progress (inline) -->
            <div class="progress-inline" id="progressSection" style="display:none;">
                <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
                <span class="progress-label" id="progressText">Generating...</span>
            </div>

            <!-- Audio Player (inline) -->
            <div class="player-inline" id="audioPlayer" style="display:none;">
                <button class="btn-play" id="playPauseBtn">▶</button>
                <canvas id="waveformCanvas" width="400" height="36"></canvas>
                <span class="time-label" id="timeDisplay">0:00</span>
                <input type="range" id="seekBar" min="0" max="100" value="0" class="seek-bar">
                <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-bar" title="Volume">
            </div>
        </div>

        <div class="status-strip">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Ready</span>
        </div>
    </div>

    <!-- Paste Modal -->
    <div class="overlay" id="pasteOverlay" style="display:none;">
        <div class="modal">
            <h3>📋 Paste Your Script</h3>
            <p class="modal-desc">Use the format <code>Name: dialogue</code> — one per line. Speakers are auto-detected.</p>
            <textarea id="pasteTextarea" class="paste-area" rows="14"
                placeholder="Alice: Hey Bob, have you heard about this new TTS?&#10;Bob: Yeah! It runs entirely in the browser.&#10;Alice: That's incredible!&#10;Bob: And each speaker gets a different voice."></textarea>
            <div class="modal-actions">
                <button class="btn-glass" id="pasteCancelBtn">Cancel</button>
                <button class="btn-primary" id="pasteParseBtn">Parse & Import</button>
            </div>
        </div>
    </div>

    <!-- Model Loading Overlay -->
    <div class="overlay" id="loadingOverlay" style="display:none;">
        <div class="modal">
            <div class="spinner"></div>
            <h3>Loading Kokoro Model</h3>
            <p id="loadingText">Downloading weights — first visit may take a moment.</p>
            <div class="progress-track"><div class="progress-fill" id="modelProgressBar"></div></div>
            <p class="progress-pct" id="modelProgressPercent">0%</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
